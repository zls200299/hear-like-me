# 本地开发环境
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hear_like_me?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 微信小程序（登录 code2session）
wx:
  mini:
    app-id: wx747aea8e5b113bc6
    app-secret: 5d47a6de169cc4640fe06c6d25f7aa45

hear-like-me:
  storage:
    root-path: D:/hear-like-me/data
    preview-url-prefix: http://192.168.1.4:8081
  engine:
    ffmpeg-path: ${HLM_FFMPEG_PATH:E:/hear-like-me/ffmpeg-9.0.1-essentials_build/bin/ffmpeg.exe}
    python-path: ${HLM_PYTHON_PATH:E:/dev-env/miniconda3/python.exe}
    script-path: ${HLM_ENGINE_SCRIPT:scaffolding-v2/audio-engine/cochlear_vocoder.py}
    realtime-script-path: ${HLM_REALTIME_SCRIPT:../audio-engine/realtime_vocoder.py}
    vocoder-enabled: ${HLM_VOCODER_ENABLED:true}
