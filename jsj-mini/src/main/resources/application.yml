server:
  port: 8081

spring:
  application:
    name: jsj-mini
  # 本地开发用 dev，部署服务器时改为 prod
  profiles:
    active: dev

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.zhs.model
  configuration:
    map-underscore-to-camel-case: true

# 微信小程序（各环境在 application-dev.yml / application-prod.yml 中覆盖）
wx:
  mini:
    app-id: your-appid-here
    app-secret: your-appsecret-here

# 文件存储公共项（路径、预览地址在各环境配置中覆盖）
hear-like-me:
  storage:
    provider: LOCAL
  engine:
    ffmpeg-path: ${HLM_FFMPEG_PATH:ffmpeg}
    python-path: ${HLM_PYTHON_PATH:python}
    script-path: ${HLM_ENGINE_SCRIPT:../audio-engine/cochlear_vocoder.py}
    realtime-script-path: ${HLM_REALTIME_SCRIPT:../audio-engine/realtime_vocoder.py}
    timeout-seconds: 120
    vocoder-enabled: ${HLM_VOCODER_ENABLED:true}
