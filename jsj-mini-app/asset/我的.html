<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hear Like Me - 我的</title>
<style>
  :root{
    --bg:#071521;
    --bg-deep:#04101c;
    --panel:#122238;
    --panel2:#102036;
    --stroke:rgba(121,146,180,.24);
    --text:#f5f7fb;
    --muted:#98a7bf;
    --teal:#2bd8ca;
    --teal2:#21b8c7;
    --teal-dim:#27b6c5;
  }

  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#2d2d2d}
  body{
    display:flex;
    justify-content:center;
    padding:18px 0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
  }

  .phone{
    position:relative;
    width:min(100vw,941px);
    min-height:1532px;
    overflow:hidden;
    background:
      radial-gradient(circle at 52% 18%, rgba(15,69,110,.18), transparent 34%),
      linear-gradient(180deg,#071521 0%,#071523 42%,#06121f 100%);
  }

  /* subtle grid */
  .phone::before{
    content:"";
    position:absolute;
    inset:92px 0 auto 0;
    height:530px;
    opacity:.23;
    background-image:
      linear-gradient(rgba(55,106,133,.20) 1px, transparent 1px),
      linear-gradient(90deg,rgba(55,106,133,.18) 1px, transparent 1px);
    background-size:58px 58px;
    pointer-events:none;
  }

  .hero-art{
    position:absolute;
    top:102px;
    left:0;
    right:0;
    height:430px;
    pointer-events:none;
    overflow:hidden;
  }

  .hero-art svg{
    width:100%;
    height:100%;
    display:block;
  }

  /* status bar */
  .statusbar{
    height:82px;
    position:relative;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:20px 35px 0;
    font-size:23px;
    z-index:5;
  }
  .notch{
    position:absolute;
    width:322px;
    height:70px;
    top:0;
    left:50%;
    transform:translateX(-50%);
    background:#000;
    border:2px solid rgba(255,255,255,.9);
    border-top:none;
    border-radius:0 0 34px 34px;
  }
  .status-icons{
    display:flex;
    align-items:center;
    gap:12px;
    z-index:2;
  }
  .status-icons svg{display:block}

  /* top nav */
  .topnav{
    height:87px;
    border-bottom:1px solid rgba(126,146,171,.28);
    position:relative;
    z-index:4;
  }
  .topnav-title{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-size:27px;
    font-weight:500;
  }
  .capsule{
    position:absolute;
    right:30px;
    top:11px;
    height:56px;
    width:150px;
    border:2px solid rgba(255,255,255,.32);
    border-radius:29px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    background:rgba(7,16,28,.75);
  }
  .capsule .divider{
    width:1px;height:27px;background:rgba(255,255,255,.35)
  }

  .content{
    position:relative;
    z-index:2;
    padding:22px 46px 68px;
  }

  .brand{
    margin-top:6px;
    padding:18px 12px 0;
    height:244px;
  }
  .brand-title{
    font-size:64px;
    line-height:1;
    font-weight:500;
    letter-spacing:-1.7px;
    margin-top:14px;
  }
  .brand-sub{
    margin-top:24px;
    font-size:24px;
    color:#b7c0d1;
    line-height:1.55;
    letter-spacing:.2px;
  }

  .card{
    border:1.6px solid var(--stroke);
    background:linear-gradient(180deg,rgba(18,34,56,.94),rgba(14,29,48,.94));
    border-radius:28px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.015);
  }

  .login-card{
    min-height:217px;
    display:grid;
    grid-template-columns:140px 1fr auto;
    align-items:center;
    column-gap:28px;
    padding:31px 40px 30px 34px;
    margin-bottom:34px;
  }
  .avatar{
    width:122px;height:122px;border-radius:50%;
    display:grid;place-items:center;
    background:
      radial-gradient(circle at 50% 28%,rgba(112,137,171,.28),transparent 48%),
      linear-gradient(180deg,#1a2940,#111e31);
    border:2px solid rgba(114,139,173,.35);
  }
  .avatar svg{width:88px;height:88px}
  .login-title{
    font-size:39px;
    font-weight:700;
    letter-spacing:.3px;
    margin-bottom:17px;
  }
  .login-sub{
    color:#9cabc1;
    font-size:23px;
    white-space:nowrap;
  }
  .wechat-btn{
    height:73px;
    min-width:213px;
    border:1.8px solid rgba(42,233,218,.75);
    border-radius:38px;
    padding:0 26px;
    color:#fff;
    background:linear-gradient(180deg,#27c8ce,#23b5c8);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:13px;
    font-size:25px;
    font-weight:600;
    box-shadow:0 0 25px rgba(37,203,205,.13);
  }
  .wechat-btn svg{width:35px;height:35px}

  .menu{
    overflow:hidden;
    margin-bottom:34px;
  }
  .menu-row{
    height:110px;
    display:grid;
    grid-template-columns:74px 1fr 42px;
    align-items:center;
    padding:0 27px 0 35px;
    border-bottom:1px solid rgba(119,144,176,.16);
  }
  .menu-row:last-child{border-bottom:none}
  .menu-icon{
    width:48px;height:48px;
    color:#2ac2d1;
    display:grid;
    place-items:center;
  }
  .menu-icon svg{width:48px;height:48px}
  .menu-label{
    font-size:29px;
    font-weight:500;
    letter-spacing:.4px;
  }
  .chevron{
    color:#a2afc4;
    width:32px;height:32px;
  }

  .public-card{
    min-height:146px;
    display:grid;
    grid-template-columns:70px 1fr;
    gap:24px;
    align-items:center;
    padding:28px 35px;
  }
  .heart{
    width:54px;height:54px;color:#2ac2d1;
  }
  .public-title{
    font-size:29px;
    margin-bottom:8px;
  }
  .public-sub{
    font-size:20px;
    color:#a0adc1;
    line-height:1.55;
  }

  @media (max-width:700px){
    body{padding:0}
    .phone{width:100vw;min-height:100vh}
    .statusbar{height:54px;padding:13px 22px 0;font-size:14px}
    .notch{width:200px;height:44px;border-radius:0 0 22px 22px}
    .topnav{height:55px}
    .topnav-title{font-size:18px}
    .capsule{right:14px;top:6px;width:96px;height:39px;border-radius:21px;gap:10px}
    .capsule .divider{height:19px}
    .content{padding:14px 22px 44px}
    .hero-art{top:64px;height:300px}
    .phone::before{inset:60px 0 auto;height:350px;background-size:38px 38px}
    .brand{height:166px;padding:9px 6px 0}
    .brand-title{font-size:42px}
    .brand-sub{margin-top:17px;font-size:15px}
    .login-card{
      min-height:142px;
      grid-template-columns:86px 1fr auto;
      column-gap:18px;
      padding:20px 23px 19px 20px;
      border-radius:19px;
      margin-bottom:22px;
    }
    .avatar{width:82px;height:82px}
    .avatar svg{width:59px;height:59px}
    .login-title{font-size:25px;margin-bottom:10px}
    .login-sub{font-size:15px}
    .wechat-btn{height:48px;min-width:136px;border-radius:25px;font-size:16px;padding:0 17px;gap:8px}
    .wechat-btn svg{width:23px;height:23px}
    .card{border-radius:18px}
    .menu{margin-bottom:22px}
    .menu-row{
      height:74px;
      grid-template-columns:52px 1fr 27px;
      padding:0 18px 0 23px;
    }
    .menu-icon,.menu-icon svg{width:33px;height:33px}
    .menu-label{font-size:19px}
    .chevron{width:21px;height:21px}
    .public-card{min-height:96px;grid-template-columns:47px 1fr;gap:15px;padding:18px 23px}
    .heart{width:37px;height:37px}
    .public-title{font-size:19px;margin-bottom:4px}
    .public-sub{font-size:13px}
  }

  @media(max-width:430px){
    .login-card{grid-template-columns:72px 1fr auto;column-gap:12px}
    .avatar{width:70px;height:70px}
    .avatar svg{width:50px;height:50px}
    .login-title{font-size:22px}
    .login-sub{font-size:13px}
    .wechat-btn{min-width:118px;height:44px;font-size:14px;padding:0 13px}
    .brand-title{font-size:38px}
  }
</style>
</head>
<body>
<div class="phone">

  <!-- 顶部背景装饰：全部为 SVG -->
  <div class="hero-art" aria-hidden="true">
    <svg viewBox="0 0 941 430" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="waveGrad" x1="90" y1="300" x2="840" y2="170" gradientUnits="userSpaceOnUse">
          <stop stop-color="#0a6f9d" stop-opacity=".34"/>
          <stop offset=".50" stop-color="#25d8d0" stop-opacity=".54"/>
          <stop offset="1" stop-color="#1b70a0" stop-opacity=".35"/>
        </linearGradient>
        <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
          <stop stop-color="#22f0df"/>
          <stop offset="1" stop-color="#22f0df" stop-opacity="0"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <g opacity=".7">
        <path d="M-40 326C99 287 183 293 298 332C401 367 510 367 627 308C747 248 820 230 992 258"
              stroke="url(#waveGrad)" stroke-width="2.2"/>
        <path d="M-40 338C106 296 187 302 301 340C407 375 512 374 633 318C754 262 828 243 992 270"
              stroke="#1dc2c5" stroke-opacity=".22"/>
        <path d="M-40 350C110 307 193 314 309 352C412 385 522 385 640 330C761 274 834 256 992 283"
              stroke="#159bb5" stroke-opacity=".17"/>
        <path d="M-40 360C116 318 199 326 315 363C423 397 530 395 649 342C770 288 840 270 992 296"
              stroke="#117a9d" stroke-opacity=".14"/>
      </g>

      <g filter="url(#glow)">
        <line x1="678" y1="74" x2="678" y2="260" stroke="url(#lineGrad)" stroke-width="1.6"/>
        <circle cx="678" cy="74" r="4.2" fill="#2BF1DF"/>
        <line x1="742" y1="112" x2="742" y2="263" stroke="url(#lineGrad)" stroke-width="1.6"/>
        <circle cx="742" cy="112" r="4" fill="#2BF1DF"/>
        <line x1="704" y1="151" x2="704" y2="270" stroke="url(#lineGrad)" stroke-width="1.3"/>
        <circle cx="704" cy="151" r="3.2" fill="#2BF1DF"/>
        <line x1="771" y1="185" x2="771" y2="278" stroke="url(#lineGrad)" stroke-width="1.1"/>
        <circle cx="771" cy="185" r="3" fill="#2BF1DF"/>
        <line x1="711" y1="137" x2="711" y2="257" stroke="#E5E75C" stroke-opacity=".55"/>
        <circle cx="711" cy="137" r="3.3" fill="#E4E95B"/>
        <line x1="835" y1="205" x2="835" y2="290" stroke="url(#lineGrad)"/>
        <circle cx="835" cy="205" r="3" fill="#27E7DC"/>
      </g>
    </svg>
  </div>

  <!-- 状态栏 -->
  <div class="statusbar">
    <div>19:20</div>
    <div class="notch"></div>
    <div class="status-icons">
      <!-- signal -->
      <svg width="29" height="22" viewBox="0 0 29 22" fill="none">
        <rect x="1" y="14" width="4" height="7" rx="1.5" fill="white"/>
        <rect x="8" y="10" width="4" height="11" rx="1.5" fill="white"/>
        <rect x="15" y="6" width="4" height="15" rx="1.5" fill="white"/>
        <rect x="22" y="2" width="4" height="19" rx="1.5" fill="white"/>
      </svg>
      <!-- wifi -->
      <svg width="30" height="22" viewBox="0 0 30 22" fill="none">
        <path d="M3 7.2C9.6 1.6 20.4 1.6 27 7.2" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M7.2 11.4C11.5 7.9 18.5 7.9 22.8 11.4" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M11.7 15.4C13.6 13.9 16.4 13.9 18.3 15.4" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="15" cy="19" r="1.7" fill="white"/>
      </svg>
      <!-- battery -->
      <svg width="40" height="22" viewBox="0 0 40 22" fill="none">
        <rect x="1" y="2" width="34" height="18" rx="4" stroke="white" stroke-width="2"/>
        <rect x="4" y="5" width="28" height="12" rx="2" fill="white"/>
        <path d="M37 8V14" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <!-- 顶部导航栏 -->
  <header class="topnav">
    <div class="topnav-title">我的</div>
    <div class="capsule">
      <svg width="38" height="16" viewBox="0 0 38 16" fill="none">
        <circle cx="7" cy="8" r="4" fill="white"/>
        <circle cx="19" cy="8" r="4" fill="white"/>
        <circle cx="31" cy="8" r="4" fill="white"/>
      </svg>
      <span class="divider"></span>
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <circle cx="15" cy="15" r="11" stroke="white" stroke-width="3"/>
        <circle cx="15" cy="15" r="4.5" fill="white"/>
      </svg>
    </div>
  </header>

  <main class="content">

    <section class="brand">
      <div class="brand-title">hear like me</div>
      <div class="brand-sub">像我一样聆听——一款关于听觉、声码器和理解的教育工具</div>
    </section>

    <section class="card login-card">
      <div class="avatar">
        <svg viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="31" r="16" fill="#A9B5C9"/>
          <path d="M22 78C24 59 35 50 50 50C65 50 76 59 78 78C69 85 60 88 50 88C40 88 31 85 22 78Z" fill="#A9B5C9"/>
        </svg>
      </div>
      <div>
        <div class="login-title">未登录</div>
        <div class="login-sub">登录后同步您的设置与数据</div>
      </div>
      <button class="wechat-btn" type="button">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M16.8 8C9.7 8 4 12.7 4 18.5c0 3.3 1.9 6.2 4.9 8.2l-1.2 4.1 4.4-2.3c1.5.4 3.1.7 4.7.7 7.1 0 12.8-4.7 12.8-10.6C29.6 12.7 23.9 8 16.8 8Z" fill="white"/>
          <path d="M26.6 15.6c-5.2 0-9.4 3.4-9.4 7.7 0 4.2 4.2 7.7 9.4 7.7 1.2 0 2.4-.2 3.5-.5l3.4 1.8-.9-3c2.1-1.4 3.4-3.6 3.4-6 0-4.3-4.2-7.7-9.4-7.7Z" fill="white" stroke="#20b8c5" stroke-width="1"/>
          <circle cx="12.7" cy="17.1" r="1.7" fill="#20b8c5"/>
          <circle cx="21" cy="17.1" r="1.7" fill="#20b8c5"/>
          <circle cx="23.7" cy="22.8" r="1.4" fill="#20b8c5"/>
          <circle cx="29.6" cy="22.8" r="1.4" fill="#20b8c5"/>
        </svg>
        微信登录
      </button>
    </section>

    <section class="card menu">
      <!-- 账号信息 -->
      <div class="menu-row">
        <div class="menu-icon">
          <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="14" r="8" stroke="currentColor" stroke-width="2.4"/>
            <path d="M9 40C10.7 29.8 16.2 25 24 25C31.8 25 37.3 29.8 39 40" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="menu-label">账号信息</div>
        <svg class="chevron" viewBox="0 0 32 32" fill="none">
          <path d="M11 6L21 16L11 26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- 关于项目 -->
      <div class="menu-row">
        <div class="menu-icon">
          <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="2.4"/>
            <path d="M24 21V33" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
            <circle cx="24" cy="14.8" r="1.9" fill="currentColor"/>
          </svg>
        </div>
        <div class="menu-label">关于项目</div>
        <svg class="chevron" viewBox="0 0 32 32" fill="none">
          <path d="M11 6L21 16L11 26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- 使用说明 -->
      <div class="menu-row">
        <div class="menu-icon">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M5 11C12 8 17.5 9.5 23 13V39C17.5 35.5 12 34 5 37V11Z" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/>
            <path d="M43 11C36 8 30.5 9.5 25 13V39C30.5 35.5 36 34 43 37V11Z" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/>
            <path d="M24 13V39" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div class="menu-label">使用说明</div>
        <svg class="chevron" viewBox="0 0 32 32" fill="none">
          <path d="M11 6L21 16L11 26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- 意见反馈 -->
      <div class="menu-row">
        <div class="menu-icon">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M7 8H41V34H19L10 41V34H7V8Z" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/>
            <circle cx="16" cy="21" r="2" fill="currentColor"/>
            <circle cx="24" cy="21" r="2" fill="currentColor"/>
            <circle cx="32" cy="21" r="2" fill="currentColor"/>
          </svg>
        </div>
        <div class="menu-label">意见反馈</div>
        <svg class="chevron" viewBox="0 0 32 32" fill="none">
          <path d="M11 6L21 16L11 26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- 隐私说明 -->
      <div class="menu-row">
        <div class="menu-icon">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M24 5L39 10V21C39 31.8 33.6 39 24 43C14.4 39 9 31.8 9 21V10L24 5Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M20 19L28 27M28 19L20 27" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="menu-label">隐私说明</div>
        <svg class="chevron" viewBox="0 0 32 32" fill="none">
          <path d="M11 6L21 16L11 26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </section>

    <section class="card public-card">
      <svg class="heart" viewBox="0 0 54 54" fill="none">
        <path d="M27 46C22.6 42.4 11 34.5 7.4 26.9C4.2 20.2 7 11.5 15 9.3C20 7.9 24.5 10.2 27 14C29.5 10.2 34 7.9 39 9.3C47 11.5 49.8 20.2 46.6 26.9C43 34.5 31.4 42.4 27 46Z"
              stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M22 25.5L26 29.5L33 22.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="public-title">公益说明</div>
        <div class="public-sub">本项目用于听觉科普与教育体验，不代表真实医疗效果。</div>
      </div>
    </section>

  </main>
</div>
</body>
</html>
