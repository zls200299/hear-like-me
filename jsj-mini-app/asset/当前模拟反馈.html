<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hear Like Me - 导出当前音频（WAV）UI</title>
  <style>
    :root{
      --page:#020913;
      --screen:#06111f;
      --panel:#07172a;
      --panel-2:#061223;
      --line:#164368;
      --line-soft:rgba(83,163,219,.20);
      --text:#f4f7fb;
      --muted:#9aabc3;
      --muted-2:#7187a3;
      --cyan:#46eee5;
      --cyan-2:#26d7d4;
      --cyan-soft:rgba(70,238,229,.12);
      --cyan-glow:rgba(70,238,229,.30);
      --chip:#071426;
      --chip-line:#1b4568;
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      min-height:100%;
      background:
        radial-gradient(circle at 50% -10%, rgba(39,101,159,.13), transparent 36%),
        linear-gradient(180deg,#06101d 0%,var(--page) 100%);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:28px 12px 44px;
    }

    .phone{
      width:min(100%, 430px);
      padding:20px 18px 18px;
      border:1px solid rgba(121,160,200,.34);
      border-radius:42px;
      background:
        linear-gradient(90deg,rgba(255,255,255,.035),transparent 7%,transparent 93%,rgba(255,255,255,.035)),
        #020812;
      box-shadow:
        0 28px 80px rgba(0,0,0,.55),
        inset 0 0 0 2px rgba(255,255,255,.025),
        inset 0 0 0 8px rgba(3,11,21,.9);
    }

    .screen{
      min-height:660px;
      padding:24px 16px 24px;
      border-radius:30px;
      overflow:hidden;
      background:
        radial-gradient(circle at 22% 8%, rgba(27,107,163,.08), transparent 28%),
        radial-gradient(circle at 78% 58%, rgba(26,222,210,.045), transparent 28%),
        linear-gradient(180deg,#06111e 0%,#05101d 100%);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.018);
    }

    .feedback-card{
      position:relative;
      padding:18px 16px 18px;
      border:1px solid rgba(36,122,179,.58);
      border-radius:22px;
      background:
        radial-gradient(circle at 80% 3%, rgba(18,81,125,.11), transparent 34%),
        linear-gradient(180deg,rgba(7,24,44,.97),rgba(5,17,32,.98));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.025),
        0 14px 32px rgba(0,0,0,.14);
    }

    .card-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:20px;
    }

    .title-wrap{
      display:flex;
      align-items:center;
      min-width:0;
      gap:11px;
    }

    .title-icon{
      width:42px;
      height:42px;
      flex:0 0 42px;
      display:grid;
      place-items:center;
      border-radius:12px;
      color:var(--cyan);
      border:1px solid rgba(79,151,205,.14);
      background:linear-gradient(180deg,rgba(19,49,77,.95),rgba(10,31,53,.95));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }

    .card-title{
      margin:0;
      font-size:22px;
      line-height:1.1;
      font-weight:800;
      letter-spacing:.02em;
      white-space:nowrap;
    }

    .live-pill{
      flex:0 0 auto;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 11px;
      border-radius:999px;
      border:1px solid rgba(44,111,158,.48);
      background:rgba(5,19,35,.55);
      color:#b5c6dc;
      font-size:12px;
      line-height:1;
    }

    .live-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--cyan);
      box-shadow:0 0 10px rgba(70,238,229,.78);
    }

    .feedback-main{
      display:grid;
      grid-template-columns:142px minmax(0,1fr);
      gap:20px;
      align-items:center;
    }

    .score-gauge{
      position:relative;
      width:142px;
      aspect-ratio:1;
      display:grid;
      place-items:center;
    }

    .score-gauge svg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      overflow:visible;
    }

    .score-center{
      position:relative;
      z-index:2;
      text-align:center;
      transform:translateY(2px);
    }

    .score-num{
      display:block;
      color:var(--cyan);
      font-size:48px;
      line-height:.88;
      font-weight:850;
      letter-spacing:-.04em;
      text-shadow:0 0 18px rgba(70,238,229,.18);
    }

    .score-total{
      display:block;
      margin-top:13px;
      color:#aebbd0;
      font-size:18px;
      line-height:1;
      font-weight:600;
    }

    .summary{
      min-width:0;
    }

    .grade{
      display:flex;
      align-items:center;
      gap:10px;
      color:#d8fff9;
      font-size:22px;
      font-weight:800;
      line-height:1.15;
    }

    .grade-icon{
      width:31px;
      height:31px;
      flex:0 0 31px;
      color:var(--cyan);
    }

    .summary-text{
      margin-top:12px;
      color:#92a5bf;
      font-size:13px;
      line-height:1.6;
    }

    .chips{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
      margin-top:16px;
    }

    .chip{
      min-width:0;
      height:39px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:0 8px;
      border:1px solid var(--chip-line);
      border-radius:11px;
      background:linear-gradient(180deg,rgba(6,24,43,.92),rgba(5,18,33,.96));
      color:#b7c6db;
      font-size:11.5px;
      white-space:nowrap;
      overflow:hidden;
    }

    .chip svg{
      flex:0 0 19px;
      width:19px;
      height:19px;
      color:var(--cyan);
    }

    .divider{
      height:1px;
      margin:22px 0 18px;
      background:linear-gradient(90deg,transparent,rgba(74,130,173,.18) 8%,rgba(74,130,173,.18) 92%,transparent);
    }

    .export-btn{
      width:100%;
      min-height:62px;
      border:1.5px solid var(--cyan);
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      padding:12px 18px;
      appearance:none;
      cursor:pointer;
      color:#9ffbf5;
      background:
        radial-gradient(circle at 35% 45%, rgba(26,199,190,.09), transparent 33%),
        linear-gradient(180deg,rgba(9,35,52,.88),rgba(5,25,39,.96));
      box-shadow:
        0 0 0 1px rgba(70,238,229,.04),
        inset 0 1px 0 rgba(255,255,255,.025),
        0 0 18px rgba(70,238,229,.06);
      font:inherit;
      transition:transform .12s ease, background .12s ease, box-shadow .12s ease;
      -webkit-tap-highlight-color:transparent;
    }

    .export-btn:active{
      transform:scale(.992);
      background:linear-gradient(180deg,rgba(10,46,63,.96),rgba(5,29,43,.98));
      box-shadow:0 0 22px rgba(70,238,229,.12);
    }

    .export-icon{
      width:31px;
      height:31px;
      flex:0 0 31px;
      color:var(--cyan);
      filter:drop-shadow(0 0 7px rgba(70,238,229,.18));
    }

    .export-label{
      font-size:20px;
      line-height:1.2;
      font-weight:800;
      letter-spacing:.015em;
      text-align:center;
    }

    .helper{
      margin:11px 0 0;
      text-align:center;
      color:#8296b1;
      font-size:12px;
      line-height:1.4;
    }

    .home-indicator{
      width:120px;
      height:5px;
      margin:34px auto 0;
      border-radius:999px;
      background:rgba(246,247,249,.94);
      box-shadow:0 0 0 1px rgba(255,255,255,.05);
    }

    @media (max-width:390px){
      .screen{ padding-inline:12px; }
      .feedback-card{ padding-inline:13px; }
      .feedback-main{ grid-template-columns:124px minmax(0,1fr); gap:14px; }
      .score-gauge{ width:124px; }
      .score-num{ font-size:43px; }
      .card-title{ font-size:20px; }
      .grade{ font-size:20px; }
      .chips{ gap:6px; }
      .chip{ font-size:10.5px; padding-inline:6px; }
      .export-label{ font-size:18px; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <section class="feedback-card" aria-label="当前模拟反馈">
        <header class="card-head">
          <div class="title-wrap">
            <div class="title-icon" aria-hidden="true">
              <svg viewBox="0 0 40 40" width="30" height="30" fill="none">
                <path d="M3 22h6l4.1-11.2 6.3 20.2 5.4-24.2L29.5 22H37" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <h1 class="card-title">当前模拟反馈</h1>
          </div>

          <div class="live-pill">
            <span class="live-dot"></span>
            <span>实时分析中</span>
          </div>
        </header>

        <div class="feedback-main">
          <div class="score-gauge" aria-label="模拟反馈得分 51 分">
            <svg viewBox="0 0 180 180" aria-hidden="true">
              <defs>
                <linearGradient id="scoreArc" x1="24" y1="24" x2="158" y2="158" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#34D9EF"/>
                  <stop offset="1" stop-color="#46EEE5"/>
                </linearGradient>
                <filter id="arcGlow" x="-60%" y="-60%" width="220%" height="220%">
                  <feGaussianBlur stdDeviation="5" result="blur"/>
                  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
              </defs>
              <circle cx="90" cy="90" r="72" fill="none" stroke="#0c2a43" stroke-width="2" opacity=".9"/>
              <circle cx="90" cy="90" r="68" fill="none" stroke="#345d81" stroke-width="6" stroke-linecap="round" stroke-dasharray="2.1 4.4" opacity=".68" transform="rotate(-90 90 90)"/>
              <circle cx="90" cy="90" r="68" fill="none" stroke="url(#scoreArc)" stroke-width="7" stroke-linecap="round" stroke-dasharray="218 427" stroke-dashoffset="-3" transform="rotate(-90 90 90)" filter="url(#arcGlow)"/>
              <circle cx="90" cy="90" r="52" fill="rgba(3,18,30,.30)"/>
            </svg>
            <div class="score-center">
              <span class="score-num">51</span>
              <span class="score-total">/ 100</span>
            </div>
          </div>

          <div class="summary">
            <div class="grade">
              <svg class="grade-icon" viewBox="0 0 36 36" fill="none" aria-hidden="true">
                <rect x="4" y="19" width="5" height="13" rx="2.5" fill="currentColor"/>
                <rect x="13" y="13" width="5" height="19" rx="2.5" fill="currentColor"/>
                <rect x="22" y="8" width="5" height="24" rx="2.5" fill="currentColor"/>
                <rect x="31" y="3" width="3" height="29" rx="1.5" fill="currentColor"/>
              </svg>
              <span>大致能懂</span>
            </div>
            <div class="summary-text">在安静环境下可理解部分内容</div>

            <div class="chips">
              <div class="chip">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M3 12h2M7 7v10M11 4v16M15 8v8M19 6v12M23 11v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>通道 22</span>
              </div>

              <div class="chip">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <circle cx="5" cy="5" r="1.4"/><circle cx="12" cy="4" r="1.2"/><circle cx="18" cy="6" r="1.3"/>
                  <circle cx="8" cy="10" r="1.2"/><circle cx="15" cy="11" r="1.5"/><circle cx="21" cy="12" r="1.2"/>
                  <circle cx="4" cy="16" r="1.2"/><circle cx="11" cy="17" r="1.4"/><circle cx="18" cy="18" r="1.3"/>
                  <circle cx="8" cy="22" r="1.1"/><circle cx="15" cy="22" r="1.1"/>
                </svg>
                <span>噪声载体</span>
              </div>

              <div class="chip">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M2 14c2.2-7.5 4.6-7.5 7 0s4.8 7.5 7 0 4.6-7.5 6 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>150-7000 Hz</span>
              </div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <button class="export-btn" type="button" aria-label="导出当前音频 WAV">
          <svg class="export-icon" viewBox="0 0 36 36" fill="none" aria-hidden="true">
            <path d="M18 4v18" stroke="currentColor" stroke-width="3.1" stroke-linecap="round"/>
            <path d="M11.5 16.5 18 23l6.5-6.5" stroke="currentColor" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 25.5v3.3c0 1.7 1.4 3.2 3.2 3.2h15.6c1.8 0 3.2-1.5 3.2-3.2v-3.3" stroke="currentColor" stroke-width="3.1" stroke-linecap="round"/>
          </svg>
          <span class="export-label">导出当前音频（WAV）</span>
        </button>
        <p class="helper">生成后可保存到手机</p>
      </section>

      <div class="home-indicator" aria-hidden="true"></div>
    </div>
  </div>
</body>
</html>
