<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hear Like Me - 底部导航 SVG</title>
  <style>
    :root{
      --bg:#061221;
      --nav-bg:rgba(4,12,26,.96);
      --line:rgba(116,144,181,.18);
      --text:#6f809c;
      --active:#29dbc7;
      --active-glow:rgba(41,219,199,.18);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      background:
        radial-gradient(circle at 50% 15%, rgba(20,86,120,.12), transparent 35%),
        linear-gradient(180deg,#071424 0%,#06111f 100%);
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    }

    body{
      min-height:100vh;
      padding-bottom:calc(98px + env(safe-area-inset-bottom));
    }

    .demo{
      min-height:calc(100vh - 110px);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#6f809c;
      letter-spacing:.08em;
      font-size:14px;
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:calc(96px + env(safe-area-inset-bottom));
      padding:12px 18px calc(10px + env(safe-area-inset-bottom));
      display:grid;
      grid-template-columns:repeat(4,1fr);
      align-items:start;
      background:var(--nav-bg);
      border-top:1px solid var(--line);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    .nav-item{
      appearance:none;
      border:0;
      background:transparent;
      padding:0;
      color:var(--text);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:7px;
      font-size:13px;
      line-height:1;
      cursor:pointer;
      transition:color .18s ease, transform .18s ease;
    }

    .nav-item:active{
      transform:scale(.96);
    }

    .nav-item.active{
      color:var(--active);
    }

    .icon-wrap{
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border-radius:13px;
      transition:background .18s ease, box-shadow .18s ease;
    }

    .nav-item.active .icon-wrap{
      background:var(--active-glow);
      box-shadow:0 0 24px rgba(41,219,199,.12);
    }

    .nav-icon{
      width:30px;
      height:30px;
      display:block;
    }

    .nav-item span{
      white-space:nowrap;
    }
  </style>
</head>

<body>
  <main class="demo">底部导航 SVG 图标预览</main>

  <nav class="bottom-nav" aria-label="底部导航">

    <!-- 1. 听觉模拟：耳朵 / 听觉 -->
    <button class="nav-item" type="button">
      <span class="icon-wrap">
        <svg class="nav-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M18.3 5.2c-5.2 0-9.1 3.9-9.1 9.2 0 3.7 1.7 5.6 3.2 7.1 1.2 1.3 2.2 2.3 2.2 4.5"
                stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M18.1 9.3c3.1 0 5.4 2.3 5.4 5.4 0 2.2-1 3.7-2.1 4.8-1.2 1.2-2.1 2-2.1 3.5 0 1.4.9 2.5 2.3 2.5 2.5 0 4.6-2.9 4.6-6.7"
                stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M13.6 14.5c.5-1.7 1.8-2.8 3.6-2.8 2.1 0 3.8 1.6 3.8 3.8 0 1.8-1.1 2.8-2.1 3.7-.9.8-1.6 1.5-1.6 2.7"
                stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M14.7 26.7c.7.8 1.7 1.2 2.8 1.2"
                stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </span>
      <span>听觉模拟</span>
    </button>

    <!-- 2. 听音挑战：耳机 -->
    <button class="nav-item" type="button">
      <span class="icon-wrap">
        <svg class="nav-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M6.2 17.2v-2.1C6.2 9.5 10.6 5 16 5s9.8 4.5 9.8 10.1v2.1"
                stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M7.3 17.1H10c1.2 0 2.1.9 2.1 2.1v5.4c0 1.2-.9 2.1-2.1 2.1H8.8c-1.5 0-2.6-1.2-2.6-2.6v-4.4c0-1.5 1.1-2.6 2.6-2.6Z"
                stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M24.7 17.1H22c-1.2 0-2.1.9-2.1 2.1v5.4c0 1.2.9 2.1 2.1 2.1h1.2c1.5 0 2.6-1.2 2.6-2.6v-4.4c0-1.5-1.1-2.6-2.6-2.6Z"
                stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>听音挑战</span>
    </button>

    <!-- 3. 科普学习：毕业帽 / 学习 -->
    <button class="nav-item" type="button">
      <span class="icon-wrap">
        <svg class="nav-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M4.5 12.6 16 6.8l11.5 5.8L16 18.4 4.5 12.6Z"
                stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M9.1 15.1v6.1c0 1.8 3.1 3.8 6.9 3.8s6.9-2 6.9-3.8v-6.1"
                stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M27.5 13v7.2"
                stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="27.5" cy="22.4" r="1.4" fill="currentColor"/>
        </svg>
      </span>
      <span>科普学习</span>
    </button>

    <!-- 4. 我的：用户头像，默认选中 -->
    <button class="nav-item active" type="button">
      <span class="icon-wrap">
        <svg class="nav-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="10.5" r="5.2"
                  stroke="currentColor" stroke-width="2.4"/>
          <path d="M6.7 26.5c.8-5 4.4-8.1 9.3-8.1s8.5 3.1 9.3 8.1"
                stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </span>
      <span>我的</span>
    </button>

  </nav>

  <script>
    // 仅用于 HTML 预览切换选中态
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
        item.classList.add('active');
      });
    });
  </script>
</body>
</html>
