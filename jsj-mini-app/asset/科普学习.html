<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hear Like Me - 科普学习</title>
<style>
  :root{
    --bg:#04101e;
    --bg-deep:#020814;
    --panel:#0a1a2c;
    --panel-2:#0b2035;
    --stroke:#314965;
    --stroke-soft:rgba(92,122,156,.42);
    --text:#f5f7fb;
    --muted:#a6b2c5;
    --cyan:#28e0d0;
    --cyan-2:#16bcd0;
    --warn:#ffbb3e;
    --nav:#020d19;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;
    min-height:100%;
    background:#1f1f1f;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }

  body{
    display:flex;
    justify-content:center;
    padding:0;
  }

  .phone{
    position:relative;
    width:min(100vw,1024px);
    min-height:1536px;
    overflow:hidden;
    border-radius:46px;
    background:
      radial-gradient(circle at 76% 22%, rgba(0,203,217,.08), transparent 24%),
      radial-gradient(circle at 18% 20%, rgba(0,122,255,.06), transparent 22%),
      linear-gradient(180deg,#020814 0%,#03101d 43%,#04111f 100%);
    border:1px solid rgba(255,255,255,.18);
  }

  /* subtle grid */
  .phone::before{
    content:"";
    position:absolute;
    inset:130px 0 auto 0;
    height:430px;
    opacity:.16;
    background-image:
      linear-gradient(rgba(43,110,140,.16) 1px, transparent 1px),
      linear-gradient(90deg,rgba(43,110,140,.14) 1px, transparent 1px);
    background-size:55px 55px;
    pointer-events:none;
  }

  .statusbar{
    position:relative;
    z-index:8;
    height:84px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:24px 48px 0;
    font-size:24px;
    font-weight:500;
  }

  .notch{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:377px;
    height:53px;
    background:#000;
    border:1.8px solid rgba(255,255,255,.9);
    border-top:none;
    border-radius:0 0 34px 34px;
  }

  .status-icons{
    display:flex;
    gap:12px;
    align-items:center;
    z-index:2;
  }

  .topbar{
    height:78px;
    border-bottom:1px solid rgba(106,131,161,.25);
    position:relative;
    z-index:7;
  }
  .topbar-title{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-size:31px;
    font-weight:500;
  }
  .capsule{
    position:absolute;
    right:23px;
    top:7px;
    width:162px;
    height:57px;
    border-radius:30px;
    border:1.8px solid rgba(255,255,255,.35);
    background:rgba(3,9,19,.75);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
  }
  .capsule .divider{width:1px;height:25px;background:rgba(255,255,255,.34)}

  .content{
    position:relative;
    z-index:2;
    padding:58px 48px 160px;
  }

  .hero{
    position:relative;
    min-height:395px;
    overflow:hidden;
    margin:0 -48px;
    padding:15px 64px 20px;
  }

  .hero-wave{
    position:absolute;
    left:0;right:0;bottom:10px;
    height:150px;
    opacity:.74;
  }

  .hero-copy{
    position:relative;
    z-index:3;
    width:56%;
  }

  .hero-title{
    font-size:76px;
    line-height:1;
    font-weight:900;
    letter-spacing:1px;
    background:linear-gradient(180deg,#28ead8 0%,#1fc1cf 52%,#1a8fc6 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 24px rgba(36,219,214,.1);
  }
  .hero-heading{
    margin-top:28px;
    font-size:39px;
    font-weight:700;
    letter-spacing:.5px;
  }
  .hero-desc{
    margin-top:21px;
    font-size:24px;
    line-height:1.6;
    color:#b4bed0;
  }

  .ear-visual{
    position:absolute;
    right:44px;
    top:20px;
    width:355px;
    height:310px;
    opacity:.96;
  }

  .warning{
    height:80px;
    display:flex;
    align-items:center;
    gap:22px;
    padding:0 32px;
    border:1.5px solid rgba(27,197,174,.72);
    border-radius:22px;
    background:linear-gradient(180deg,rgba(8,39,45,.55),rgba(8,27,40,.55));
    margin-top:-8px;
    font-size:22px;
    color:#d5dbe6;
  }
  .warning-icon{color:var(--warn);flex:0 0 auto}

  .section-title{
    margin:38px 0 24px;
    font-size:34px;
    font-weight:800;
  }

  .topic-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 28px;
  }

  .topic-card{
    min-height:242px;
    border:1.5px solid rgba(79,108,145,.55);
    border-radius:24px;
    background:
      linear-gradient(180deg,rgba(7,23,40,.94),rgba(5,17,31,.94));
    padding:38px 30px 26px;
    display:grid;
    grid-template-columns:118px 1fr;
    column-gap:26px;
    position:relative;
    overflow:hidden;
  }
  .topic-card::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,rgba(25,182,200,.025),transparent 45%);
    pointer-events:none;
  }

  .topic-icon{
    width:104px;
    height:104px;
    border-radius:50%;
    border:1.5px solid rgba(29,207,205,.55);
    color:var(--cyan);
    display:grid;
    place-items:center;
    background:radial-gradient(circle,rgba(13,82,88,.28),rgba(6,24,39,.52));
  }

  .topic-title{
    font-size:30px;
    line-height:1.25;
    font-weight:750;
  }
  .topic-desc{
    margin-top:14px;
    font-size:21px;
    line-height:1.5;
    color:#9eacc2;
  }
  .enter{
    position:absolute;
    right:30px;
    bottom:24px;
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--cyan);
    font-size:22px;
    font-weight:500;
  }

  .learning-box{
    margin-top:30px;
    min-height:154px;
    border:1.5px solid rgba(79,108,145,.45);
    border-radius:22px;
    background:linear-gradient(180deg,rgba(7,23,40,.94),rgba(5,17,31,.94));
    padding:28px 28px 24px;
  }
  .learning-title{
    font-size:31px;
    font-weight:800;
  }
  .learning-pills{
    margin-top:22px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
  }
  .pill{
    height:56px;
    border:1.4px solid rgba(23,197,202,.65);
    border-radius:29px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:#e8edf4;
    font-size:18px;
    background:rgba(6,27,40,.55);
  }
  .pill svg{color:var(--cyan);width:26px;height:26px}

  .tabbar{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:142px;
    background:rgba(2,12,23,.98);
    border-top:1px solid rgba(95,120,151,.28);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    align-items:center;
    padding:12px 20px 28px;
    z-index:9;
  }
  .tab{
    color:#7b8ba4;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
    font-size:18px;
  }
  .tab svg{width:44px;height:44px}
  .tab.active{color:var(--cyan)}
  .tab.active svg{filter:drop-shadow(0 0 8px rgba(40,224,208,.2))}

  @media(max-width:700px){
    .phone{border-radius:0;min-height:100vh}
    .statusbar{height:54px;padding:13px 22px 0;font-size:14px}
    .notch{width:200px;height:44px;border-radius:0 0 22px 22px}
    .topbar{height:55px}
    .topbar-title{font-size:18px}
    .capsule{right:12px;top:7px;width:97px;height:40px;border-radius:21px;gap:9px}
    .capsule .divider{height:18px}
    .content{padding:35px 24px 100px}
    .hero{margin:0 -24px;padding:10px 32px 14px;min-height:265px}
    .hero-copy{width:60%}
    .hero-title{font-size:48px}
    .hero-heading{font-size:25px;margin-top:19px}
    .hero-desc{font-size:15px;margin-top:13px}
    .ear-visual{right:17px;top:11px;width:220px;height:205px}
    .hero-wave{height:100px}
    .warning{height:56px;padding:0 19px;gap:13px;border-radius:16px;font-size:14px}
    .section-title{margin:25px 0 16px;font-size:22px}
    .topic-grid{gap:11px 16px}
    .topic-card{
      min-height:165px;
      padding:24px 18px 18px;
      grid-template-columns:75px 1fr;
      column-gap:16px;
      border-radius:17px;
    }
    .topic-icon{width:68px;height:68px}
    .topic-title{font-size:20px}
    .topic-desc{font-size:14px;margin-top:9px}
    .enter{right:18px;bottom:15px;font-size:15px;gap:6px}
    .learning-box{margin-top:20px;min-height:104px;padding:18px;border-radius:15px}
    .learning-title{font-size:20px}
    .learning-pills{margin-top:14px;gap:9px}
    .pill{height:39px;border-radius:21px;font-size:12px;gap:6px}
    .pill svg{width:18px;height:18px}
    .tabbar{height:92px;padding:8px 12px 15px}
    .tab{font-size:12px;gap:4px}
    .tab svg{width:30px;height:30px}
  }
</style>
</head>
<body>
<div class="phone">

  <!-- 状态栏 -->
  <div class="statusbar">
    <div>21:30</div>
    <div class="notch"></div>
    <div class="status-icons">
      <svg width="29" height="21" viewBox="0 0 29 21" fill="none">
        <rect x="1" y="14" width="4" height="6" rx="1.3" fill="#fff"/>
        <rect x="8" y="10" width="4" height="10" rx="1.3" fill="#fff"/>
        <rect x="15" y="6" width="4" height="14" rx="1.3" fill="#fff"/>
        <rect x="22" y="2" width="4" height="18" rx="1.3" fill="#fff"/>
      </svg>
      <svg width="28" height="21" viewBox="0 0 28 21" fill="none">
        <path d="M2 6.8C8.6 1.5 19.4 1.5 26 6.8" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/>
        <path d="M6.7 10.9C11 7.7 17 7.7 21.3 10.9" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/>
        <path d="M11.2 15C13 13.7 15 13.7 16.8 15" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/>
        <circle cx="14" cy="18.5" r="1.4" fill="#fff"/>
      </svg>
      <svg width="39" height="21" viewBox="0 0 39 21" fill="none">
        <rect x="1" y="2" width="33" height="17" rx="3.6" stroke="#fff" stroke-width="1.8"/>
        <rect x="4" y="5" width="27" height="11" rx="2" fill="#fff"/>
        <path d="M36 7.5V13.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-title">科普学习</div>
    <div class="capsule">
      <svg width="40" height="16" viewBox="0 0 40 16">
        <circle cx="7" cy="8" r="4" fill="#fff"/>
        <circle cx="20" cy="8" r="4" fill="#fff"/>
        <circle cx="33" cy="8" r="4" fill="#fff"/>
      </svg>
      <span class="divider"></span>
      <svg width="31" height="31" viewBox="0 0 31 31" fill="none">
        <circle cx="15.5" cy="15.5" r="11.5" stroke="#fff" stroke-width="3"/>
        <circle cx="15.5" cy="15.5" r="4.4" fill="#fff"/>
      </svg>
    </div>
  </header>

  <main class="content">
    <section class="hero">
      <div class="hero-copy">
        <div class="hero-title">听觉知识库</div>
        <div class="hero-heading">了解听觉，也理解人工耳蜗</div>
        <div class="hero-desc">把复杂原理讲清楚，把听觉体验讲明白。</div>
      </div>

      <!-- 右侧耳朵 + 植入体装饰 SVG -->
      <svg class="ear-visual" viewBox="0 0 360 320" fill="none" aria-hidden="true">
        <defs>
          <radialGradient id="earGlow" cx="0" cy="0" r="1" gradientTransform="translate(170 154) scale(155)">
            <stop stop-color="#16d3dd" stop-opacity=".22"/>
            <stop offset="1" stop-color="#16d3dd" stop-opacity="0"/>
          </radialGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle cx="180" cy="155" r="150" fill="url(#earGlow)"/>
        <g opacity=".55">
          <ellipse cx="174" cy="145" rx="130" ry="100" stroke="#169fb0" stroke-width="1.1"/>
          <ellipse cx="174" cy="145" rx="105" ry="82" stroke="#169fb0" stroke-width=".9" stroke-dasharray="3 7"/>
        </g>
        <g filter="url(#glow)">
          <path d="M167 60C117 60 87 96 88 147C89 192 115 215 137 222C154 227 160 246 151 263C143 278 152 294 168 294C193 294 203 269 208 247C214 219 229 213 241 195C258 168 261 120 239 89C222 67 197 60 167 60Z"
                stroke="#26d7dc" stroke-width="3.2"/>
          <path d="M170 88C139 87 117 111 119 143C120 167 136 181 152 184C165 187 171 199 165 211C160 222 168 232 180 231C195 230 198 214 203 202C208 188 221 179 226 166C238 136 218 90 170 88Z"
                stroke="#18b5c8" stroke-width="2.2"/>
          <path d="M170 116C150 115 139 129 141 147C143 163 155 168 166 169C175 170 180 177 178 184C176 192 181 198 188 198C200 198 202 186 205 176C209 160 203 118 170 116Z"
                stroke="#199caf" stroke-width="1.6"/>
        </g>
        <!-- processor / implant -->
        <g transform="translate(247 70)">
          <circle cx="42" cy="42" r="29" stroke="#28d8df" stroke-opacity=".65" stroke-width="2"/>
          <circle cx="42" cy="42" r="17" stroke="#28d8df" stroke-opacity=".4"/>
          <path d="M56 55C71 74 80 92 83 115" stroke="#28d8df" stroke-opacity=".58" stroke-width="2.2" stroke-linecap="round"/>
          <rect x="69" y="104" width="14" height="45" rx="7" transform="rotate(-29 69 104)" fill="#0b5872" stroke="#2ed8de" stroke-opacity=".55"/>
        </g>
      </svg>

      <!-- 波纹 -->
      <svg class="hero-wave" viewBox="0 0 1024 150" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 95C120 120 185 84 281 95C374 106 402 135 495 126C585 117 617 57 699 61C790 66 829 116 1024 88"
              stroke="#168ba8" stroke-opacity=".46" stroke-width="2"/>
        <path d="M0 108C121 132 187 98 282 108C375 118 405 145 498 137C587 129 619 72 699 76C792 80 834 128 1024 101"
              stroke="#1b6f94" stroke-opacity=".35" stroke-width="1.5"/>
        <path d="M0 82C122 105 184 68 279 80C376 92 404 120 498 111C586 103 616 45 700 49C789 53 828 102 1024 75"
              stroke="#20c7ce" stroke-opacity=".32" stroke-width="1.3"/>
      </svg>
    </section>

    <section class="warning">
      <svg class="warning-icon" width="41" height="41" viewBox="0 0 44 44" fill="none">
        <path d="M19.6 6.7L4.8 33C3.5 35.3 5.2 38.2 7.9 38.2H36.1C38.8 38.2 40.5 35.3 39.2 33L24.4 6.7C23.4 4.8 20.6 4.8 19.6 6.7Z" stroke="currentColor" stroke-width="2.7" stroke-linejoin="round"/>
        <path d="M22 15V25" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="22" cy="31" r="1.8" fill="currentColor"/>
      </svg>
      <span>本模块用于听觉与人工耳蜗相关知识科普，不替代专业医疗建议。</span>
    </section>

    <div class="section-title">学习专题</div>

    <section class="topic-grid">
      <!-- 1 -->
      <article class="topic-card">
        <div class="topic-icon">
          <svg width="70" height="70" viewBox="0 0 72 72" fill="none">
            <path d="M36 15C24 15 15 24 15 36C15 46 22 53 30 56" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M36 20C45 20 53 27 53 36C53 43 49 48 44 51" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M30 56C27 63 33 66 39 62C45 58 44 50 39 47C34 44 28 47 27 52" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M35 29C29 29 25 33 25 38C25 44 30 46 34 46C39 46 42 43 42 39C42 34 39 29 35 29Z" stroke="currentColor" stroke-width="2.8"/>
          </svg>
        </div>
        <div>
          <div class="topic-title">人工耳蜗基础入门</div>
          <div class="topic-desc">分频、包络、电极与<br>耳蜗频率地图</div>
        </div>
        <div class="enter">进入
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M7 4L14 11L7 18" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </article>

      <!-- 2 -->
      <article class="topic-card">
        <div class="topic-icon">
          <svg width="70" height="70" viewBox="0 0 72 72" fill="none">
            <path d="M14 31C14 23.8 20 18 27.3 18H44.7C52 18 58 23.8 58 31V36C58 43.2 52 49 44.7 49H35L26 58V49H27.3C20 49 14 43.2 14 36V31Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="27" cy="34" r="2.8" fill="currentColor"/>
            <circle cx="36" cy="34" r="2.8" fill="currentColor"/>
            <circle cx="45" cy="34" r="2.8" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <div class="topic-title">声音如何被“听见”</div>
          <div class="topic-desc">声音旅程与信号处理<br>空气 → 处理器 →<br>电极 → 大脑</div>
        </div>
        <div class="enter">进入
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M7 4L14 11L7 18" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </article>

      <!-- 3 -->
      <article class="topic-card">
        <div class="topic-icon">
          <svg width="70" height="70" viewBox="0 0 72 72" fill="none">
            <path d="M15 42V30M24 49V23M33 54V18M42 45V27M51 50V22M60 41V31" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="topic-title">人工耳蜗的局限性</div>
          <div class="topic-desc">音质、声调、噪声与<br>重新学习</div>
        </div>
        <div class="enter">进入
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M7 4L14 11L7 18" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </article>

      <!-- 4 -->
      <article class="topic-card">
        <div class="topic-icon">
          <svg width="70" height="70" viewBox="0 0 72 72" fill="none">
            <circle cx="36" cy="30" r="14" stroke="currentColor" stroke-width="3"/>
            <path d="M22 52C25 45 29 42 36 42C43 42 47 45 50 52" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M28 27C31 24 33 23 36 23C39 23 41 24 44 27" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="31" cy="31" r="1.7" fill="currentColor"/>
            <circle cx="41" cy="31" r="1.7" fill="currentColor"/>
            <path d="M31 36C34 38 38 38 41 36" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="topic-title">儿童听觉发展与支持</div>
          <div class="topic-desc">新生儿筛查、听力评估<br>干预与长期支持</div>
        </div>
        <div class="enter">进入
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M7 4L14 11L7 18" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </article>
    </section>

    <section class="learning-box">
      <div class="learning-title">学习收获</div>
      <div class="learning-pills">
        <div class="pill">
          <svg viewBox="0 0 28 28" fill="none">
            <path d="M16 5C11 5 7 9 7 14C7 18 9 20 11 22C12 23 13 24 13 26" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M16 9C19 9 21 11 21 14C21 16 20 17 19 18C18 19 18 20 18 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          认识人工耳蜗
        </div>
        <div class="pill">
          <svg viewBox="0 0 28 28" fill="none">
            <path d="M3 15V13M7 18V10M11 20V8M15 22V6M19 19V9M23 17V11M27 15V13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          理解声音处理
        </div>
        <div class="pill">
          <svg viewBox="0 0 28 28" fill="none">
            <path d="M12 4L3.8 19C3 20.5 4.1 22.2 5.8 22.2H22.2C23.9 22.2 25 20.5 24.2 19L16 4C15.1 2.4 12.9 2.4 12 4Z" stroke="currentColor" stroke-width="2.1"/>
            <path d="M14 9V15" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
            <circle cx="14" cy="18.4" r="1.2" fill="currentColor"/>
          </svg>
          了解技术局限
