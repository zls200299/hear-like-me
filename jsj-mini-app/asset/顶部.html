<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Hear Like Me - 顶部 UI 原型</title>
<style>
:root{
  --bg:#07111f;
  --bg-2:#0a1626;
  --card:#101d2f;
  --card-2:#0d1929;
  --line:#2a3b50;
  --line-soft:rgba(255,255,255,.08);
  --text:#f4f7fb;
  --text-2:#aab7ca;
  --text-3:#71819a;
  --teal:#28e0c2;
  --teal-2:#13c7ad;
  --teal-soft:rgba(40,224,194,.12);
  --warn:#f7b329;
  --shadow:0 18px 50px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:#040b14;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh;display:flex;justify-content:center;padding:24px 0}
.demo-shell{
  position:relative;
  width:min(100vw,430px);
  min-height:932px;
  background:
    radial-gradient(circle at 18% 4%,rgba(19,199,173,.10),transparent 24%),
    radial-gradient(circle at 92% 32%,rgba(42,91,142,.11),transparent 30%),
    linear-gradient(180deg,#07111f 0%,#081321 100%);
  overflow:hidden;
  border:1px solid rgba(255,255,255,.06);
  box-shadow:var(--shadow);
}
.app{
  min-height:932px;
  padding:48px 18px 122px;
}
.header{position:relative;margin-bottom:20px}
.header-actions{position:absolute;right:0;top:0;display:flex;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(4,12,22,.55)}
.header-actions .divider{width:1px;height:24px;background:var(--line);margin:0 10px}
.icon-btn{width:24px;height:24px;display:grid;place-items:center;color:#eef4fb}
h1{margin:0;font-size:32px;line-height:1.1;letter-spacing:.5px;font-weight:800}
.brand{margin-top:6px;color:var(--teal);font-size:16px;font-weight:700;letter-spacing:.3px}
.desc{margin:28px 0 14px;color:var(--text-2);font-size:14px;line-height:1.75}
.notice{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid rgba(247,179,41,.17);background:rgba(247,179,41,.07);color:#b9c3d3;font-size:13px}
.notice svg{flex:0 0 auto;color:var(--warn)}
.card{margin-top:18px;padding:18px;border:1px solid rgba(111,136,167,.35);border-radius:16px;background:linear-gradient(180deg,rgba(16,29,47,.95),rgba(12,23,38,.95));box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.card-title{font-size:20px;font-weight:800;margin:0 0 16px}
.source-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.source-btn{appearance:none;border:1px solid #405066;background:rgba(12,23,38,.65);border-radius:14px;padding:16px 8px 14px;min-height:116px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:16px;cursor:pointer;transition:.18s ease}
.source-btn svg{width:34px;height:34px}
.source-btn.active{color:var(--teal);border-color:var(--teal);background:linear-gradient(180deg,rgba(24,78,78,.52),rgba(16,54,61,.72));box-shadow:0 0 0 1px rgba(40,224,194,.15),0 0 24px rgba(40,224,194,.12)}
.source-detail{margin-top:14px;padding:16px;border:1px solid rgba(91,119,151,.25);border-radius:14px;background:rgba(6,17,29,.42)}
.detail-head{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800}
.detail-head svg{width:21px;color:#a4b2c7}
.status-row{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--text-2);font-size:14px}
.status-dot{width:11px;height:11px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px rgba(40,224,194,.9)}
.meter{height:34px;display:flex;align-items:flex-end;gap:3px;margin:10px 0 6px;padding:0 2px}
.bar{width:4px;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#33e9ca,#14b9a1);opacity:.95;box-shadow:0 0 8px rgba(40,224,194,.12)}
.bar.dim{opacity:.18;box-shadow:none}
.detail-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.hint{display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:13px;white-space:nowrap}
.stop-btn{height:38px;padding:0 14px;border-radius:11px;border:1px solid #53647a;background:rgba(13,25,41,.8);color:#eef4fb;font-size:14px;cursor:pointer}
.listen-card{padding-bottom:20px}
.listen-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.play-btn{height:72px;border-radius:14px;border:1px solid #52647b;background:rgba(12,23,38,.72);color:#f7f9fc;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:.18s ease}
.play-btn.primary{border-color:transparent;background:linear-gradient(135deg,#32e0c7 0%,#19c8af 100%);color:#06141c;box-shadow:0 10px 30px rgba(23,200,175,.18)}
.play-btn svg{width:24px;height:24px}
.play-btn:active,.source-btn:active,.stop-btn:active{transform:translateY(1px)}
.bottom-nav{position:absolute;left:0;right:0;bottom:0;height:100px;padding:12px 12px max(14px,env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.08);background:rgba(4,13,24,.92);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(4,1fr);align-items:start}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;color:#7f8ea4;font-size:12px}
.nav-item svg{width:24px;height:24px}
.nav-item.active{color:var(--teal)}
@media (max-width:370px){
  .app{padding-left:14px;padding-right:14px}
  h1{font-size:29px}
  .source-btn{min-height:106px;font-size:15px}
  .detail-footer{align-items:flex-end;flex-direction:column}
  .hint{align-self:flex-start}
  .listen-actions{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="demo-shell">
  <main class="app">
    <header class="header">
      <div class="header-actions" aria-hidden="true">
        <span class="icon-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="divider"></span>
        <span class="icon-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
      </div>
      <h1>听觉模拟</h1>
      <div class="brand">hear like me</div>
      <p class="desc">选择声音，调整参数，体验人工耳蜗的听觉呈现效果。</p>
      <div class="notice">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2.8 19a2 2 0 0 0 1.74 3h14.92a2 2 0 0 0 1.74-3L12 3Z"/><path d="M12 9v5"/><circle cx="12" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
        <span>本工具仅用于科普体验，不代表真实医疗效果。</span>
      </div>
    </header>

    <section class="card">
      <h2 class="card-title">音频来源</h2>
      <div class="source-grid" id="sourceGrid">
        <button class="source-btn" data-source="sample">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
          <span>示例声音</span>
        </button>
        <button class="source-btn" data-source="upload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16l-4-4-4 4"/><path d="M12 12v9"/><path d="M20.4 17.5A5 5 0 0 0 18 8.2 7 7 0 0 0 4.3 10.6 4.5 4.5 0 0 0 5 19h3"/></svg>
          <span>上传音频</span>
        </button>
        <button class="source-btn active" data-source="mic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M9 21h6"/></svg>
          <span>实时麦克风</span>
        </button>
      </div>

      <div class="source-detail" id="sourceDetail">
        <div class="detail-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
          <span id="detailTitle">实时麦克风</span>
        </div>
        <div class="status-row"><span class="status-dot"></span><span id="detailStatus">正在采集麦克风音频</span></div>
        <div class="meter" id="meter" aria-hidden="true"></div>
        <div class="detail-footer">
          <div class="hint">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 13v5a2 2 0 0 0 2 2h2v-8H6a2 2 0 0 0-2 2"/><path d="M20 13v5a2 2 0 0 1-2 2h-2v-8h2a2 2 0 0 1 2 2"/><path d="M4 14v-2a8 8 0 0 1 16 0v2"/></svg>
            <span id="detailHint">建议佩戴耳机，避免回声</span>
          </div>
          <button class="stop-btn" id="stopBtn">停止采集</button>
        </div>
      </div>
    </section>

    <section class="card listen-card">
      <h2 class="card-title">试听</h2>
      <div class="listen-actions">
        <button class="play-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12v3"/><path d="M8 9v9"/><path d="M12 5v14"/><path d="M16 8v8"/><path d="M20 11v2"/></svg>
          <span>播放原声</span>
        </button>
        <button class="play-btn primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12v3"/><path d="M8 9v9"/><path d="M12 5v14"/><path d="M16 8v8"/><path d="M20 11v2"/></svg>
          <span>播放模拟声</span>
        </button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 13v5a2 2 0 0 0 2 2h2v-8H6a2 2 0 0 0-2 2"/><path d="M20 13v5a2 2 0 0 1-2 2h-2v-8h2a2 2 0 0 1 2 2"/><path d="M4 14v-2a8 8 0 0 1 16 0v2"/></svg>
      <span>听觉模拟</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 4h8v3a4 4 0 0 1-8 0V4Z"/><path d="M6 5H4v2a4 4 0 0 0 4 4"/><path d="M18 5h2v2a4 4 0 0 1-4 4"/><path d="M12 11v5"/><path d="M8 20h8"/></svg>
      <span>听音挑战</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22V5.5Z"/><path d="M20 5.5A3.5 3.5 0 0 0 16.5 2H13v17h3.5A3.5 3.5 0 0 1 20 22V5.5Z"/></svg>
      <span>科普学习</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span>我的</span>
    </div>
  </nav>
</div>
<script>
const meter = document.getElementById('meter')
const heights = [9,10,11,13,16,20,22,18,15,17,14,12,13,12,11,10,9,8,7,6,5,5,4,4,3,3,2,2,2,2]
heights.forEach((h,i)=>{
  const el=document.createElement('span')
  el.className='bar'+(i>17?' dim':'')
  el.style.height=h+'px'
  meter.appendChild(el)
})

document.querySelectorAll('.source-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.source-btn').forEach(b=>b.classList.remove('active'))
    btn.classList.add('active')
    const source=btn.dataset.source
    const title=document.getElementById('detailTitle')
    const status=document.getElementById('detailStatus')
    const hint=document.getElementById('detailHint')
    const stop=document.getElementById('stopBtn')
    if(source==='mic'){
      title.textContent='实时麦克风';status.textContent='正在采集麦克风音频';hint.textContent='建议佩戴耳机，避免回声';stop.textContent='停止采集';
    }else if(source==='sample'){
      title.textContent='示例声音';status.textContent='已选择示例音频';hint.textContent='可直接试听原声与模拟声';stop.textContent='切换示例';
    }else{
      title.textContent='上传音频';status.textContent='等待选择音频文件';hint.textContent='支持 MP3 / WAV 等常见格式';stop.textContent='选择文件';
    }
  })
})
</script>
</body>
</html>
